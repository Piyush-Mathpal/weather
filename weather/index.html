<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather Map Dashboard</title>
    <!-- Add Google Font Inter for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b111e;
            color: white;
            min-height: 100vh;
        }

        /* BACKGROUND MAP */
        .map-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none; /* Let user enjoy ambient background without dragging it accidentally */
        }

        /* GRADIENT OVERLAY to make text readable */
        .map-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(135deg, rgba(8, 15, 30, 0.7) 0%, rgba(8, 15, 30, 0.3) 100%);
            pointer-events: none;
        }

        /* DASHBOARD WRAPPER */
        .dashboard {
            position: relative;
            z-index: 2; /* Sits above the map */
            padding: 40px;
            max-width: 1600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 30px;
            pointer-events: none; /* Let clicks pass through dashboard empty space to the map */
        }

        /* GLASSMORPHISM UTILITY */
        .glass {
            background: rgba(16, 28, 45, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
            pointer-events: auto; /* Catch clicks for widgets */
        }

        /* SEARCH BAR */
        .search-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .search {
            width: 100%;
            max-width: 600px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s ease;
        }

        .search:focus-within {
            animation: borderPulse 2.5s infinite;
            transform: translateY(-2px);
            background: rgba(16, 28, 45, 0.85);
        }

        .search input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 18px;
        }

        .search input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search button {
            background: linear-gradient(135deg, #1e90ff, #00c6ff);
            border: none;
            color: white;
            padding: 12px 16px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search button:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 20px rgba(30, 144, 255, 0.8);
        }

        .search button:active {
            transform: scale(0.95);
        }

        /* WIDGET GRID */
        .widgets {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            flex: 1;
            width: 100%;
        }

        /* LEFT COLUMN (Current + Hourly) */
        .col-main {
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex: 1.5;
            min-width: 320px;
        }

        /* RIGHT COLUMN (Air + Forecast) */
        .col-side {
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex: 1;
            min-width: 300px;
        }

        /* CURRENT WEATHER */
        .current-weather {
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .city-name {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
            /* Text gradient */
            background: linear-gradient(to right, #ffffff, #a0c4eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .temp-display {
            font-size: 96px;
            font-weight: 300;
            line-height: 1;
            margin-top: 10px;
            animation: tempPulse 4s infinite;
        }

        .icon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Floating Animation */
        @keyframes customFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .icon-floating-wrapper {
            animation: customFloat 4s ease-in-out infinite;
            display: inline-block;
        }

        .weather-icon {
            width: 160px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .weather-icon:hover {
            transform: scale(1.25) rotate(10deg);
            filter: drop-shadow(0 20px 30px rgba(0, 198, 255, 0.8)) brightness(1.2);
        }

        .weather-icon:active {
            transform: scale(0.9) rotate(-5deg);
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.5));
        }

        .condition-text {
            font-size: 20px;
            color: #b0c4de;
            margin-top: -10px;
            font-weight: 600;
        }

        /* HOURLY */
        .hourly-section {
            padding: 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #b0c4de;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .hourly-scroll {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 15px;
        }

        /* Custom thin scrollbar */
        .hourly-scroll::-webkit-scrollbar {
            height: 6px;
        }
        
        .hourly-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .hourly-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .hourly-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .hour-card {
            min-width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 16px;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .hour-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .hour-time { font-size: 14px; color: #b0c4de; }
        .hour-temp { font-size: 22px; font-weight: 600; }

        /* AIR CONDITIONS */
        .air-section {
            padding: 30px;
        }

        .air-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .air-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .air-item:hover {
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0, 0, 0, 0.45);
            transform: scale(1.02);
        }

        .air-label { font-size: 15px; color: #b0c4de; }
        .air-val { font-size: 24px; font-weight: 600; }

        /* FORECAST */
        .forecast-section {
            padding: 30px;
            flex: 1; /* Stretch to fill */
        }

        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .day-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .day-row:hover {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            transform: translateX(5px);
        }

        .day-name { font-size: 18px; font-weight: 600; width: 60px; }
        .day-temps { font-size: 18px; font-weight: 600; width: 80px; text-align: right; }

        /* NEW EFFECTS: Cascading Entrance Animation */
        @keyframes fadeUpCascade {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .search-container { animation: fadeUpCascade 0.7s cubic-bezier(0.2, 1, 0.3, 1) both 0.1s; }
        .current-weather { animation: fadeUpCascade 0.7s cubic-bezier(0.2, 1, 0.3, 1) both 0.2s; }
        .hourly-section { animation: fadeUpCascade 0.7s cubic-bezier(0.2, 1, 0.3, 1) both 0.3s; }
        .interactive-map-section { animation: fadeUpCascade 0.7s cubic-bezier(0.2, 1, 0.3, 1) both 0.4s; }
        .air-section { animation: fadeUpCascade 0.7s cubic-bezier(0.2, 1, 0.3, 1) both 0.5s; }
        .forecast-section { animation: fadeUpCascade 0.7s cubic-bezier(0.2, 1, 0.3, 1) both 0.6s; }

        /* NEW EFFECTS: Pulse Glow on Temp */
        @keyframes tempPulse {
            0%, 100% { text-shadow: 0 0 10px rgba(255, 255, 255, 0.1); }
            50% { text-shadow: 0 0 35px rgba(255, 255, 255, 0.6); }
        }

        /* NEW EFFECTS: Search Focus Pulsing */
        @keyframes borderPulse {
            0% { box-shadow: 0 0 30px rgba(30, 144, 255, 0.4); border-color: rgba(30, 144, 255, 0.4); }
            50% { box-shadow: 0 0 50px rgba(30, 144, 255, 0.9); border-color: rgba(30, 144, 255, 1); }
            100% { box-shadow: 0 0 30px rgba(30, 144, 255, 0.4); border-color: rgba(30, 144, 255, 0.4); }
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .widgets {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .dashboard { padding: 20px; gap: 20px; }
            .city-name { font-size: 36px; }
            .temp-display { font-size: 72px; }
            .weather-icon { width: 120px; }
            .air-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- WINDY MAP BACKGROUND -->
    <iframe id="windyMap" 
            class="map-background" 
            src="" 
            frameborder="0" 
            loading="lazy">
    </iframe>
    <div class="map-overlay"></div>

    <!-- GLASS DASHBOARD -->
    <div class="dashboard">

        <!-- SEARCH -->
        <div class="search-container">
            <div class="search glass">
                <input id="cityInput" placeholder="Enter city manually or discover map...">
                <button onclick="getWeather()">🔍</button>
            </div>
        </div>

        <div class="widgets">
            <!-- MAIN COLUMN -->
            <div class="col-main">
                <!-- CURRENT -->
                <div class="current-weather glass">
                    <div>
                        <div class="city-name" id="city">Searching...</div>
                        <div class="temp-display" id="temp">--°</div>
                    </div>
                    <div class="icon-container">
                        <div class="icon-floating-wrapper">
                            <img id="icon" class="weather-icon" style="display: none;" alt="Condition">
                        </div>
                        <div class="condition-text" id="condition"></div>
                    </div>
                </div>

                <!-- HOURLY -->
                <div class="hourly-section glass">
                    <div class="section-title">Today's Forecast</div>
                    <div class="hourly-scroll" id="hourly">
                        <!-- Hour cards generated in JS -->
                    </div>
                </div>

                <!-- INTERACTIVE MAP WIDGET -->
                <div class="interactive-map-section glass" style="padding: 30px; display: flex; flex-direction: column; gap: 15px;">
                    <div class="section-title">Interactive Radar Map</div>
                    <iframe id="interactiveMap"
                            src=""
                            frameborder="0"
                            loading="lazy"
                            style="width: 100%; height: 350px; border-radius: 16px; pointer-events: auto;">
                    </iframe>
                </div>
            </div>

            <!-- SIDE COLUMN -->
            <div class="col-side">
                <!-- AIR CONDITIONS -->
                <div class="air-section glass">
                    <div class="section-title">Conditions</div>
                    <div class="air-grid">
                        <div class="air-item">
                            <span class="air-label">🌡️ Real Feel</span>
                            <span class="air-val" id="feels">--°C</span>
                        </div>
                        <div class="air-item">
                            <span class="air-label">💧 Humidity</span>
                            <span class="air-val" id="humidity">--%</span>
                        </div>
                        <div class="air-item">
                            <span class="air-label">💨 Wind Speed</span>
                            <span class="air-val" id="wind">-- km/h</span>
                        </div>
                        <div class="air-item">
                            <span class="air-label">⏲️ Pressure</span>
                            <span class="air-val" id="pressure">-- hPa</span>
                        </div>
                    </div>
                </div>

                <!-- FORECAST -->
                <div class="forecast-section glass">
                    <div class="section-title">6-Day Extended Forecast</div>
                    <div class="forecast-list" id="forecast">
                        <!-- Day rows generated in JS -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>

        /* ENTER KEY SUPPORT */
        document.getElementById("cityInput").addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                getWeather();
            }
        });

        /* MAP UPDATER */
        function updateMap(lat, lon) {
            // Windy API Embed with dynamic lat/lon
            const mapSrc = `https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km/h&zoom=7&overlay=wind&product=ecmwf&level=surface&lat=${lat}&lon=${lon}`;
            document.getElementById("windyMap").src = mapSrc;
            
            // Dedicated interactive map for the user to explore manually
            const interactiveSrc = `https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=km/h&zoom=5&overlay=wind&product=ecmwf&level=surface&lat=${lat}&lon=${lon}`;
            let interactiveMapEl = document.getElementById("interactiveMap");
            if (interactiveMapEl) interactiveMapEl.src = interactiveSrc;
        }

        /* GET WEATHER */
        async function getWeather(defaultCity) {
            let city = document.getElementById("cityInput").value.trim();
            if (defaultCity && city === "") {
                city = defaultCity;
            }

            if (city === "") return;

            try {
                let res = await fetch(`/api/weather?city=${encodeURIComponent(city)}`);

                let data = await res.json();

                if (data.error) {
                    alert(data.error.message);
                    return;
                }

                // 1. Update Map Coordinates
                updateMap(data.location.lat, data.location.lon);

                // 2. Update Basic Elements
                document.getElementById("city").innerText = data.location.name;
                document.getElementById("temp").innerText = Math.round(data.current.temp_c) + "°";
                
                let iconImg = document.getElementById("icon");
                iconImg.src = "https:" + data.current.condition.icon.replace("64x64", "128x128");
                iconImg.style.display = "block";
                document.getElementById("condition").innerText = data.current.condition.text;

                document.getElementById("feels").innerText = Math.round(data.current.feelslike_c) + "°C";
                document.getElementById("humidity").innerText = data.current.humidity + "%";
                document.getElementById("wind").innerText = data.current.wind_kph + " km/h";
                document.getElementById("pressure").innerText = data.current.pressure_mb + " hPa";

                // 3. Hourly Forecast
                let hourlyHtml = "";
                let currentHourIndex = parseInt(data.location.localtime.split(" ")[1].split(":")[0], 10);
                let hoursData = data.forecast.forecastday[0].hour;
                let nextHours = [];
                
                // Get next 8 hours for a wider scrollable view
                for (let i = currentHourIndex; i < currentHourIndex + 8; i++) {
                    if (i < 24) {
                        nextHours.push(hoursData[i]);
                    } else if (data.forecast.forecastday[1]) {
                        nextHours.push(data.forecast.forecastday[1].hour[i - 24]);
                    }
                }

                nextHours.forEach(hour => {
                    let time = parseInt(hour.time.split(" ")[1].split(":")[0], 10);
                    let displayTime = time > 12 ? (time - 12) + " PM" : (time === 0 ? "12 AM" : (time === 12 ? "12 PM" : time + " AM"));
                    hourlyHtml += `
                        <div class="hour-card">
                            <span class="hour-time">${displayTime}</span>
                            <img src="https:${hour.condition.icon.replace("64x64", "128x128")}" width="45" alt="Icon" style="image-rendering: -webkit-optimize-contrast;">
                            <span class="hour-temp">${Math.round(hour.temp_c)}°</span>
                        </div>
                    `;
                });
                document.getElementById("hourly").innerHTML = hourlyHtml;

                // 4. Daily Forecast
                let forecastHtml = "";
                data.forecast.forecastday.forEach(day => {
                    let dateObj = new Date(day.date);
                    let dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' });
                    forecastHtml += `
                        <div class="day-row">
                            <span class="day-name">${dayName}</span>
                            <img src="https:${day.day.condition.icon.replace("64x64", "128x128")}" width="45" alt="Icon" style="image-rendering: -webkit-optimize-contrast;">
                            <span class="day-temps">${Math.round(day.day.maxtemp_c)}° / ${Math.round(day.day.mintemp_c)}°</span>
                        </div>
                    `;
                });
                document.getElementById("forecast").innerHTML = forecastHtml;

            } catch (err) {
                console.log(err);
            }
        }

        // LOAD DEFAULT
        window.onload = () => {
            getWeather("London"); // Boots up map & data instantly
        };
    </script>
</body>
</html>
